PACKAGE_NAME="btmtk-mt7902"
PACKAGE_VERSION="1.0"

# The patched btmtk.c is based on Ubuntu 6.17.0-19 (= upstream v6.17). Its
# kernel-internal API usage matches 6.17 only, so do not build on other series.
# Kernels >= 7.1 already contain the MT7902 support and do not need this.
BUILD_EXCLUSIVE_KERNEL="^6\.17\."

MAKE[0]="make KVER=${kernelver}"
CLEAN="make clean KVER=${kernelver}"

BUILT_MODULE_NAME[0]="btmtk"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
